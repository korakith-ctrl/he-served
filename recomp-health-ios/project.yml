name: RecompHealth
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  RecompHealth:
    type: application
    platform: iOS
    sources:
      - path: RecompHealth
    info:
      path: RecompHealth/Info.plist
      properties:
        CFBundleDisplayName: Recomp Health
        LSRequiresIPhoneOS: true
        NSHealthShareUsageDescription: Recomp อ่านจำนวนก้าว การนอน น้ำหนัก องค์ประกอบร่างกาย และการออกกำลังกาย เพื่ออัปเดตแดชบอร์ด 16 สัปดาห์ของคุณ
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: RecompHealth/RecompHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.korakritinsa.recomphealth
        PRODUCT_NAME: Recomp Health
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: RecompHealth/RecompHealth.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  RecompHealth:
    build:
      targets:
        RecompHealth: all
    run:
      config: Debug
    archive:
      config: Release
