name: Recomp
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.2.0
targets:
  Recomp:
    type: application
    platform: iOS
    sources:
      - path: Recomp
      - path: ../recomp-health-ios/RecompHealth/HealthKitManager.swift
      - path: ../recomp-health-ios/RecompHealth/Models.swift
    info:
      path: Recomp/Info.plist
      properties:
        CFBundleDisplayName: Recomp
        LSRequiresIPhoneOS: true
        NSHealthShareUsageDescription: Recomp อ่านก้าว การนอน น้ำหนัก และกิจกรรมจาก Apple Health เพื่อแสดงผลและซิงก์ในบันทึกของคุณ
        NSCameraUsageDescription: Recomp ใช้กล้องถ่ายรูปอาหารเพื่อให้ AI ประเมินพลังงาน โดยให้คุณตรวจทานก่อนบันทึก
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Recomp/Recomp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.korakritinsa.recomp
        PRODUCT_NAME: Recomp
        DEVELOPMENT_TEAM: W7DM4KM395
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Recomp/Recomp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Recomp:
    build:
      targets:
        Recomp: all
    run:
      config: Debug
    archive:
      config: Release
